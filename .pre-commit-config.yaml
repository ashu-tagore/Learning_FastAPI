# Runs the same checks as CI, before each commit.
# Install once with: cd atlas && uv run pre-commit install --config ../.pre-commit-config.yaml
# Local hooks call the project's own pinned tools through uv, so versions never drift from CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory atlas ruff check
        language: system
        files: ^atlas/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory atlas ruff format --check
        language: system
        files: ^atlas/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory atlas mypy src tests
        language: system
        files: ^atlas/.*\.py$
        pass_filenames: false
