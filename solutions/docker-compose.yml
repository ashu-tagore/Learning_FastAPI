services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside the compose network, Postgres is reachable by its service name.
      DATABASE_HOSTNAME: db
      DATABASE_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 2s
      retries: 15

volumes:
  postgres-data:
