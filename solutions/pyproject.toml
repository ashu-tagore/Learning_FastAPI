[project]
name = "learning-fastapi-solutions"
version = "0.1.0"
description = "Reference solution for the FastAPI Backend Path tutorial"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.4",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "alembic>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
