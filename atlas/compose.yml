# Local development services. Start with: docker compose up -d
#
# The Atlas processes themselves (lesson 7.1) are behind the "app" profile, so plain
# `docker compose up -d` still starts only the services that tests and the command line
# need. The whole system, built from ./Dockerfile:
#   docker compose --profile app up -d --build
services:
  db:
    # Postgres 17 with the pgvector extension (lesson 6.4); same major version as before.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: atlas
      # A throwaway password for a database that only listens on your own machine.
      # Real deployments read secrets from a secret store (Part 7), never from this file.
      POSTGRES_PASSWORD: atlas-dev-password
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      retries: 15

  # The job queue (lesson 5.1); also the cache and rate limiter in lesson 5.5.
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # A local stand-in for Amazon SQS, which is Atlas's job queue on AWS (lesson 7.5). Atlas
  # uses Redis for jobs unless SQS_QUEUE_URL is set, so only the SQS tests need this.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "127.0.0.1:9324:9324"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9324/health"]
      interval: 2s
      retries: 15

  # S3-compatible object storage for repository snapshots (lesson 5.4). On AWS: real S3.
  # `weed mini` runs every SeaweedFS part in one process, which is plenty for development.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: ["mini", "-dir=/data", "-bucket=atlas-snapshots"]
    environment:
      # Throwaway local credentials, like the database password above.
      AWS_ACCESS_KEY_ID: atlas
      AWS_SECRET_ACCESS_KEY: atlas-dev-secret-key
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - atlas-objects:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 30

  # Local language models (Part 6). After the first start, download the two models once:
  #   docker compose exec ollama ollama pull qwen3:1.7b
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:0.40.16
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - atlas-models:/root/.ollama

  # ---------- Atlas itself (lesson 7.1): one image, one service per process ----------

  # Runs the migrations, then exits. The other Atlas services wait for it to succeed, so
  # they never start against an outdated schema.
  migrate:
    profiles: ["app"]
    build: .
    image: atlas:local
    command: ["atlas", "init-db"]
    environment: &atlas-environment
      # Service names, not localhost: inside a container, localhost is the container itself.
      DATABASE_URL: postgresql+psycopg://atlas:atlas-dev-password@db:5432/atlas
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: atlas
      AWS_SECRET_ACCESS_KEY: atlas-dev-secret-key
      OLLAMA_URL: http://ollama:11434
      # Development-only values, like the database password above.
      SECRET_KEY: dev-only-key-at-least-32-characters-long
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["app"]
    image: atlas:local
    environment:
      <<: *atlas-environment
      # The web UI is mounted from the repository here; on AWS, CloudFront serves it (7.7).
      WEB_DIR: /web
    volumes:
      - ../web:/web:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: &after-migrations
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      # Readiness from lesson 4.4: the API can reach its database. python, because the
      # slim image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      retries: 10

  worker:
    profiles: ["app"]
    image: atlas:local
    command: ["atlas", "worker"]
    environment: *atlas-environment
    volumes:
      # Clones survive a restart, so the next sync fetches only what changed (lesson 5.3).
      - atlas-repos:/home/atlas/.cache/atlas
    depends_on: *after-migrations

  scheduler:
    profiles: ["app"]
    image: atlas:local
    command: ["atlas", "scheduler"]
    environment: *atlas-environment
    depends_on: *after-migrations

  notifier:
    profiles: ["app"]
    image: atlas:local
    command: ["atlas", "notifier"]
    environment: *atlas-environment
    depends_on: *after-migrations

volumes:
  atlas-repos:
  atlas-db:
  atlas-objects:
  atlas-models:
