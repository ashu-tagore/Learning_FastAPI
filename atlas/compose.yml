# Local development services. Start with: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: atlas
      # A throwaway password for a database that only listens on your own machine.
      # Real deployments read secrets from a secret store (Part 7), never from this file.
      POSTGRES_PASSWORD: atlas-dev-password
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      retries: 15

  # The job queue (lesson 5.1); also the cache and rate limiter in lesson 5.5.
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

volumes:
  atlas-db:
