[project]
name = "atlas"
version = "0.1.0"
description = "Reference implementation for the Zero to Production in FastAPI course"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.11.0",
    "boto3>=1.44.6",
    "email-validator>=2.4.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
atlas = "atlas.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.6",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: real errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simpler code
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["atlas"]
# Async SQLAlchemy switches between greenlets; without this, code after those switches
# is reported as never run (lesson 4.19).
concurrency = ["greenlet", "thread"]
# Migrations run through Alembic in CI's migration step, not through pytest.
omit = ["*/atlas/migrations/*"]
