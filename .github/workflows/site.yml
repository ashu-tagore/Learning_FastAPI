name: Course site

on:
  push:
    branches: [main]
    paths: ["course/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["course/**", ".github/workflows/site.yml"]
  workflow_dispatch:

# Pages deploys need these; nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older, unfinished one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated pages are up to date
        # Part pages and the sidebar come from docs/context/04-curriculum.md.
        run: |
          python3 course/_tools/generate_part_pages.py
          git diff --exit-code course/
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42
      - name: Render
        run: quarto render course
      - uses: actions/upload-pages-artifact@v3
        with:
          path: course/_site

  deploy:
    # Pull requests only check that the site builds; only main publishes it.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
