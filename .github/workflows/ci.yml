name: CI

on:
  push:
    branches: [main]
    paths: ["atlas/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["atlas/**", ".github/workflows/ci.yml"]

jobs:
  atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    # A real Postgres for the database tests (lesson 3.11), same major version as compose.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-test-password
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas-test-password@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest -v
      # Migrations run from empty on their own database, then `alembic check` fails the build
      # if a model changed without a migration (lesson 4.11).
      - name: Migrations
        env:
          PGPASSWORD: atlas-test-password
          DATABASE_URL: postgresql+psycopg://atlas:atlas-test-password@localhost:5432/migrations
        run: |
          psql -h localhost -U atlas -d atlas_test -c "CREATE DATABASE migrations"
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
