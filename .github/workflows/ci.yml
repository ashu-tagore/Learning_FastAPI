name: CI

# On every pull request, not only those touching atlas/: the jobs here are required checks
# (lesson 7.2), so they must report a result on every pull request, including ones that
# only change lessons. Without path filters there is no case where they don't run.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, with no code change: the image is rebuilt with that week's security updates and
  # scanned against that week's vulnerability database, and dependencies are audited
  # against newly published advisories (lesson 7.2).
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Read the repository, nothing more: a compromised step can't push or change settings.
permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push, which nobody needs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    # A real Postgres for the database tests (lesson 3.11), same major version as compose.yml.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-test-password
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 2s
          --health-retries 15
      # The job queue (lesson 5.1), same version as compose.yml.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 15
      # A local SQS, Atlas's job queue on AWS (lesson 7.5), same version as compose.yml.
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:9324/health"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas-test-password@localhost:5432/atlas_test
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_S3_URL: http://localhost:8333
      TEST_SQS_URL: http://localhost:9324
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Object storage (lesson 5.4). Not a service: services can't pass a command, and
      # SeaweedFS needs `mini`. Same image and throwaway credentials as compose.yml.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=atlas -e AWS_SECRET_ACCESS_KEY=atlas-dev-secret-key \
            chrislusf/seaweedfs:4.54 mini -dir=/data
          for _ in $(seq 30); do
            curl -sf http://localhost:8333/healthz && break
            sleep 2
          done
      - name: Install dependencies
        run: uv sync --locked
      # Known vulnerabilities in the exact versions the image installs (lesson 7.2). Hashes,
      # so the audit checks the same files the lock file pins.
      - name: Dependency audit
        run: |
          uv export --locked --no-dev --format requirements-txt --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.0 pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src tests
      - name: Tests
        # Coverage is reported, not enforced: it shows what no test runs (lesson 4.19).
        run: uv run pytest -v --cov --cov-report=term-missing
      # Migrations run from empty on their own database, then `alembic check` fails the build
      # if a model changed without a migration (lesson 4.13).
      - name: Migrations
        env:
          PGPASSWORD: atlas-test-password
          DATABASE_URL: postgresql+psycopg://atlas:atlas-test-password@localhost:5432/migrations
        run: |
          psql -h localhost -U atlas -d atlas_test -c "CREATE DATABASE migrations"
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      # The newest migration again, on a database with data: a NOT NULL column without a
      # default passes on empty tables and fails on real ones (lesson 7.2).
      - name: Newest migration on a database with data
        env:
          DATABASE_URL: postgresql+psycopg://atlas:atlas-test-password@localhost:5432/migrations
        run: |
          uv run python -m tests.seed
          uv run alembic downgrade -1
          uv run alembic upgrade head

  # The production image (lesson 7.1): built, started and scanned on every change, because
  # some failures only exist inside it (a development-only import crashed it once).
  image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Today's date, so the image's security-update step runs once a day instead of being
      # reused from the cache forever (lesson 7.2).
      - name: Date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: atlas
          tags: atlas:ci
          build-args: SECURITY_UPDATES_DATE=${{ steps.date.outputs.today }}
          # Into the runner's Docker, for the checks below; pushing is lesson 7.8's job.
          load: true
          # Layers cached between runs, so an unchanged lock file means an unchanged
          # dependency layer here too.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Every module imports without development dependencies
        run: |
          docker run --rm atlas:ci python -c "
          import importlib, pkgutil, atlas
          names = [m.name for m in pkgutil.walk_packages(atlas.__path__, 'atlas.') if '.migrations' not in m.name]
          for name in names:
              importlib.import_module(name)
          print(f'{len(names)} modules import')"
      - name: Runs as a non-root user, with git
        run: |
          test "$(docker run --rm atlas:ci whoami)" = atlas
          docker run --rm atlas:ci git --version
          docker run --rm atlas:ci atlas --help > /dev/null
      # Fails on high or critical vulnerabilities that have a fix; reports the rest without
      # failing, since nothing can be done about them until a fix exists (lesson 7.1).
      - name: Vulnerability scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 atlas:ci

  # Atlas's AWS configuration (lesson 7.4), checked without an AWS account: formatting,
  # validity, tests against a mocked AWS provider, and a scan for insecure settings.
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate
      - name: Tests against a mocked AWS
        run: terraform test
      - name: Configuration scan
        run: |
          docker run --rm -v "$PWD:/infra:ro" aquasec/trivy:0.69.3 \
            config --quiet --exit-code 1 --severity HIGH,CRITICAL /infra

